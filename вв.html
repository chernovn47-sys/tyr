<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Мир Суперкаров</title>
    <style>
        /* --- CSS СТИЛИ --- */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #1a1a1a;
            color: #fff;
            line-height: 1.6;
        }

        header {
            background: linear-gradient(rgba(0,0,0,0.7), rgba(0,0,0,0.7)), url('https://images.unsplash.com/photo-1617814076367-b759c7d7e738?auto=format&fit=crop&w=1920&q=80') no-repeat center center/cover;
            height: 60vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 20px;
        }

        header h1 {
            font-size: 3.5rem;
            margin-bottom: 10px;
            text-transform: uppercase;
            letter-spacing: 2px;
            color: #ff3333;
        }

        header p {
            font-size: 1.2rem;
            max-width: 600px;
        }

        .container {
            max-width: 1200px;
            margin: 40px auto;
            padding: 0 20px;
        }

        .filter-buttons {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-bottom: 30px;
        }

        .btn {
            background-color: #333;
            color: #fff;
            border: 2px solid #ff3333;
            padding: 10px 20px;
            cursor: pointer;
            font-size: 1rem;
            border-radius: 5px;
            transition: all 0.3s ease;
        }

        .btn:hover, .btn.active {
            background-color: #ff3333;
            color: #fff;
        }

        .car-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 30px;
        }

        .car-card {
            background-color: #262626;
            border-radius: 10px;
            overflow: hidden;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
            transition: transform 0.3s ease;
        }

        .car-card:hover {
            transform: translateY(-5px);
        }

        .car-image {
            width: 100%;
            height: 200px;
            object-fit: cover;
        }

        .car-info {
            padding: 20px;
        }

        .car-info h3 {
            font-size: 1.5rem;
            margin-bottom: 10px;
            color: #ff3333;
        }

        .car-info p {
            font-size: 0.95rem;
            color: #ccc;
            margin-bottom: 15px;
        }

        .specs {
            display: flex;
            justify-content: space-between;
            font-size: 0.85rem;
            background-color: #1f1f1f;
            padding: 10px;
            border-radius: 5px;
        }

        .specs span {
            color: #aaa;
        }

        .specs strong {
            color: #fff;
        }

        footer {
            text-align: center;
            padding: 20px;
            background-color: #111;
            margin-top: 40px;
            font-size: 0.9rem;
            color: #666;
        }
    </style>
</head>
<body>

    <header>
        <h1>Мир Скорости</h1>
        <p>Добро пожаловать в каталог легендарных суперкаров. Выберите категорию, чтобы узнать больше.</p>
    </header>

    <div class="container">
        <div class="filter-buttons">
            <button class="btn active" onclick="filterCars('all')">Все</button>
            <button class="btn" onclick="filterCars('sport')">Спорткары</button>
            <button class="btn" onclick="filterCars('hyper')">Гиперкары</button>
        </div>

        <div class="car-grid" id="carGrid">
            </div>
    </div>

    <footer>
        <p>&copy; 2026 Мир Автомобилей. Все изображения взяты из открытых источников.</p>
    </footer>

    <script>
        // --- JS ДАННЫЕ И ЛОГИКА ---
        const cars = [
            {
                name: "Porsche 911 GT3 RS",
                category: "sport",
                description: "Эталон трекового автомобиля, допущенного на дороги общего пользования. Атмосферный двигатель и идеальная управляемость.",
                image: "https://images.unsplash.com/photo-1705703290616-430c004cbba5?auto=format&fit=crop&w=600&q=80",
                speed: "319 км/ч",
                power: "525 л.с."
            },
            {
                name: "Bugatti Chiron",
                category: "hyper",
                description: "Настоящий шедевр инженерной мысли. Один из самых быстрых и роскошных гиперкаров в истории человечества.",
                image: "https://images.unsplash.com/photo-1600706432502-75a0e2751452?auto=format&fit=crop&w=600&q=80",
                speed: "420 км/ч",
                power: "1500 л.с."
            },
            {
                name: "Ferrari F8 Tributo",
                category: "sport",
                description: "Итальянская классика с мощным V8 турбомотором. Воплощение аэродинамики, скорости и неповторимого стиля Маранелло.",
                image: "https://images.unsplash.com/photo-1583121274602-3e2820c69888?auto=format&fit=crop&w=600&q=80",
                speed: "340 км/ч",
                power: "720 л.с."
            },
            {
                name: "Koenigsegg Jesko",
                category: "hyper",
                description: "Гиперкар, созданный ломать рекорды скорости. Революционная трансмиссия и экстремальная прижимная сила.",
                image: "https://images.unsplash.com/photo-1627454820516-dc767bcb4d3e?auto=format&fit=crop&w=600&q=80",
                speed: "480+ км/ч",
                power: "1600 л.с."
            }
        ];

        function displayCars(filteredCars) {
            const grid = document.getElementById('carGrid');
            grid.innerHTML = '';

            filteredCars.forEach(car => {
                const card = document.createElement('div');
                card.className = 'car-card';
                card.innerHTML = `
                    <img src="${car.image}" alt="${car.name}" class="car-image">
                    <div class="car-info">
                        <h3>${car.name}</h3>
                        <p>${car.description}</p>
                        <div class="specs">
                            <div><span>Скорость:</span> <strong>${car.speed}</strong></div>
                            <div><span>Мощность:</span> <strong>${car.power}</strong></div>
                        </div>
                    </div>
                `;
                grid.appendChild(card);
            });
        }

        function filterCars(category) {
            // Меняем активную кнопку
            const buttons = document.querySelectorAll('.btn');
            buttons.forEach(btn => btn.classList.remove('active'));
            event.target.classList.add('active');

            // Фильтруем массив
            if (category === 'all') {
                displayCars(cars);
            } else {
                const filtered = cars.filter(car => car.category === category);
                displayCars(filtered);
            }
        }

        // Первичный запуск при загрузке страницы
        window.onload = () => {
            displayCars(cars);
        };
    </script>
</body>
</html>
